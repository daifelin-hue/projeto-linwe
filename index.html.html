<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico LINWE - 4 Pilares</title>
    <style>
        :root {
            --navy: #1a2a4a;
            --navy-dark: #0f1b33;
            --gold: #c9a227;
            --gold-light: #e0c15a;
            --white: #ffffff;
            --bg-gray: #f4f7f9;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-gray);
            color: var(--navy);
            line-height: 1.6;
        }

        .container { max-width: 1000px; margin: 0 auto; padding-bottom: 50px; }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, var(--navy-dark), var(--navy));
            color: var(--white);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 5px solid var(--gold);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header h1 { font-size: 26px; margin-bottom: 5px; letter-spacing: 1px; }
        .subtitle { color: var(--gold-light); font-weight: 600; text-transform: uppercase; font-size: 14px; letter-spacing: 2px; }
        .tagline { font-size: 13px; margin-top: 10px; opacity: 0.9; }
        .tagline .gold { color: var(--gold-light); font-weight: bold; }

        .empresa-box { margin-top: 25px; }
        .empresa-box input {
            width: 100%; max-width: 400px; padding: 12px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1);
            color: white; text-align: center; font-size: 16px; outline: none;
        }
        .empresa-box input:focus { border-color: var(--gold); }

        /* PROGRESS */
        .progress-container { background: #cbd5e0; height: 8px; width: 100%; overflow: hidden; }
        .progress-bar { background: var(--gold); height: 100%; width: 0%; transition: 0.4s; }

        /* TABS */
        .tabs { display: flex; background: var(--white); overflow-x: auto; border-bottom: 1px solid var(--border-color); }
        .tab {
            flex: 1; padding: 18px; text-align: center; cursor: pointer;
            font-weight: bold; font-size: 13px; color: #718096; border-bottom: 3px solid transparent;
            transition: 0.3s; min-width: 150px;
        }
        .tab.active { color: var(--navy); border-bottom: 3px solid var(--navy); background: #f8fafc; }

        /* CONTENT */
        .content-section { background: var(--white); padding: 30px; display: none; min-height: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .content-section.active { display: block; }

        .question-card { margin-bottom: 35px; padding-bottom: 25px; border-bottom: 1px solid var(--border-color); }
        .question-text { font-weight: 600; margin-bottom: 20px; font-size: 16px; display: flex; gap: 10px; }
        .question-num { color: var(--gold); font-weight: 800; }

        .rating-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .rating-group { display: flex; flex-direction: column; gap: 10px; }
        .rating-label { font-size: 11px; font-weight: 800; color: #4a5568; text-transform: uppercase; letter-spacing: 1px; }

        .options { display: flex; justify-content: space-between; }
        .option { text-align: center; flex: 1; cursor: pointer; }
        .option input { display: none; }
        .option-circle {
            width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--border-color);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 5px;
            font-weight: bold; transition: 0.2s; color: #718096;
        }
        .option input:checked + .option-circle { background: var(--navy); color: white; border-color: var(--navy); transform: scale(1.1); }
        .option-desc { font-size: 9px; color: #a0aec0; display: block; line-height: 1; }

        /* NAV BUTTONS */
        .nav-btns { padding: 25px; background: var(--white); display: flex; justify-content: space-between; border-radius: 0 0 15px 15px; }
        button { padding: 14px 30px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 14px; }
        .btn-prev { background: #edf2f7; color: #4a5568; }
        .btn-next { background: var(--navy); color: white; }
        .btn-result { background: var(--gold); color: var(--navy-dark); }

        /* RESULTS */
        .results-area { display: none; background: var(--white); padding: 40px; border-radius: 20px; margin-top: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .summary-card { background: var(--navy-dark); color: white; padding: 25px; border-radius: 15px; text-align: center; }
        .summary-card h4 { font-size: 12px; text-transform: uppercase; opacity: 0.7; margin-bottom: 10px; }
        .summary-card .value { font-size: 32px; font-weight: bold; color: var(--gold-light); }

        .pillar-report { border: 1px solid var(--border-color); border-radius: 15px; padding: 25px; margin-bottom: 20px; }
        .pillar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .status-badge { padding: 6px 15px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; color: white; }
        .rec-box { background: #fffaf0; border-left: 4px solid var(--gold); padding: 20px; margin-top: 15px; border-radius: 0 10px 10px 0; font-size: 14px; }
        .service-tag { display: block; margin-top: 15px; font-size: 13px; font-weight: bold; color: var(--navy); }

        /* FOOTER */
        .footer { text-align: center; padding: 60px 20px; margin-top: 40px; border-top: 1px solid var(--border-color); }
        .footer-text { font-size: 12px; color: #718096; font-weight: 600; }

        @media (max-width: 768px) {
            .rating-wrapper { grid-template-columns: 1fr; }
            .tabs { flex-wrap: nowrap; }
        }

        @media print {
            .header, .tabs, .nav-btns, .progress-container, .actions-print { display: none !important; }
            .results-area { display: block !important; box-shadow: none; padding: 0; }
            body { background: white; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <h1>Diagnóstico Empresarial</h1>
        <div class="subtitle">Consultoria e Desenvolvimento</div>
        <div class="tagline">Pessoas | <span class="gold">Processos</span> | Resultados</div>

        <div class="empresa-box">
            <input type="text" id="nomeEmpresa" placeholder="Nome da Empresa Avaliada" oninput="saveProgress()">
        </div>
    </header>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="mainForm">
        <div class="tabs" id="tabContainer"></div>
        <div id="sectionsContainer"></div>

        <div class="nav-btns">
            <button class="btn-prev" id="btnPrev" onclick="changeTab(-1)">Anterior</button>
            <button class="btn-next" id="btnNext" onclick="changeTab(1)">Próximo</button>
            <button class="btn-result" id="btnResult" style="display:none;" onclick="calculateResults()">Ver Resultados</button>
        </div>
    </div>

    <div class="results-area" id="resultsArea">
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 id="resEmpresa" style="font-size: 28px;">Relatório de Diagnóstico</h2>
            <p style="color: #718096;">Análise de Maturidade dos 4 Pilares</p>
        </div>

        <div class="summary-grid" id="summaryGrid"></div>
        <div id="detailedResults"></div>

        <div class="actions-print" style="text-align:center; margin-top:40px; display: flex; gap: 15px; justify-content: center;">
            <button class="btn-next" onclick="window.print()">Imprimir PDF</button>
            <button class="btn-prev" onclick="resetForm()">Novo Diagnóstico</button>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-text">
            LINWE — Consultoria e Desenvolvimento<br>
            Pessoas | <span style="color:var(--gold)">Processos</span> | Resultados
        </div>
    </footer>
</div>

<script>
    const PILARES = [
        {
            nome: "Liderança",
            perguntas: [
                "Está definido para o líder as etapas mínimas diárias para acompanhar pessoas, processos e resultados?",
                "Os papéis, responsabilidades e expectativas estão claros para toda a equipe (gestores e liderados)?",
                "A comunicação e os feedbacks entre líderes e equipes é clara, padronizada e eficiente e baseada em fatos?",
                "O time atual é composto por diferentes perfis comportamentais?",
                "Os líderes desenvolvem autonomia, delegando responsabilidades e acompanhando a evolução da equipe?"
            ],
            rec: "Estruturar rotinas de liderança, clareza de responsabilidades, comunicação, feedback e delegação.",
            servico: "Programa de Desenvolvimento de Lideranças",
            prazo: "60 a 120 dias"
        },
        {
            nome: "Excelência Operacional",
            perguntas: [
                "Os principais processos estão padronizados e são conhecidos pelas equipes?",
                "As atividades são executadas conforme os padrões definidos, reduzindo variações e retrabalhos?",
                "Os problemas são analisados na causa raiz e tratados para evitar recorrências?",
                "As equipes participam da identificação e implantação de melhorias nos processos?",
                "As melhorias implantadas permanecem funcionando e gerando resultados ao longo do tempo?"
            ],
            rec: "Mapear, padronizar e melhorar processos, tratando causas, desperdícios e sustentação das melhorias.",
            servico: "Mapeamento, Padronização e Melhoria de Processos",
            prazo: "60 a 180 dias"
        },
        {
            nome: "Qualidade",
            perguntas: [
                "Os documentos, procedimentos e registros estão atualizados e controlados?",
                "As não conformidades são registradas, tratadas e monitoradas?",
                "Os treinamentos são planejados, executados e avaliados?",
                "Os requisitos legais e regulatórios são controlados e acompanhados?",
                "A empresa atua preventivamente na identificação e mitigação de riscos?"
            ],
            rec: "Fortalecer documentos, registros, treinamentos, não conformidades, riscos e requisitos regulatórios.",
            servico: "Implantação e Fortalecimento do Sistema da Qualidade",
            prazo: "90 a 180 dias"
        },
        {
            nome: "Gestão por Dados",
            perguntas: [
                "Existem indicadores definidos para acompanhar o desempenho da empresa?",
                "Os indicadores são atualizados regularmente e possuem dados confiáveis?",
                "Os indicadores possuem metas, responsáveis e critérios claros de acompanhamento?",
                "As decisões da liderança são tomadas com base em dados e indicadores?",
                "Quando um indicador apresenta desvio, são definidas ações e acompanhados os resultados?"
            ],
            rec: "Definir indicadores, metas, responsáveis, rituais de análise e planos para tratamento de desvios.",
            servico: "Indicadores, Metas e Gestão à Vista",
            prazo: "45 a 120 dias"
        }
    ];

    let currentTab = 0;

    function init() {
        const tabContainer = document.getElementById('tabContainer');
        const sectionsContainer = document.getElementById('sectionsContainer');

        PILARES.forEach((pilar, pIdx) => {
            const tab = document.createElement('div');
            tab.className = `tab ${pIdx === 0 ? 'active' : ''}`;
            tab.innerText = pilar.nome;
            tab.onclick = () => goToTab(pIdx);
            tabContainer.appendChild(tab);

            const section = document.createElement('div');
            section.className = `content-section ${pIdx === 0 ? 'active' : ''}`;

            pilar.perguntas.forEach((q, qIdx) => {
                const id = (pIdx * 5) + qIdx + 1;
                section.innerHTML += `
                    <div class="question-card">
                        <div class="question-text"><span class="question-num">${id}.</span> ${q}</div>
                        <div class="rating-wrapper">
                            <div class="rating-group">
                                <span class="rating-label">Existe?</span>
                                <div class="options">${renderOptions(pIdx, qIdx, 'e')}</div>
                            </div>
                            <div class="rating-group">
                                <span class="rating-label">Funciona?</span>
                                <div class="options">${renderOptions(pIdx, qIdx, 'f')}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            sectionsContainer.appendChild(section);
        });
        loadProgress();
        updateUI();
    }

    function renderOptions(pIdx, qIdx, type) {
        const labelsE = ["", "Não existe", "Iniciando", "Parcial", "Estruturado", "Total"];
        const labelsF = ["", "Não funciona", "Raramente", "Parcial", "Maioria", "Consistente"];
        let html = "";
        for (let i = 1; i <= 5; i++) {
            html += `
                <label class="option">
                    <input type="radio" name="${type}_${pIdx}_${qIdx}" value="${i}" onchange="saveProgress()">
                    <div class="option-circle">${i}</div>
                    <span class="option-desc">${type === 'e' ? labelsE[i] : labelsF[i]}</span>
                </label>
            `;
        }
        return html;
    }

    function goToTab(idx) {
        currentTab = idx;
        document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
        document.querySelectorAll('.content-section').forEach((s, i) => s.classList.toggle('active', i === idx));
        updateUI();
        window.scrollTo(0, 0);
    }

    function changeTab(step) {
        const next = currentTab + step;
        if (next >= 0 && next < PILARES.length) goToTab(next);
    }

    function updateUI() {
        document.getElementById('btnPrev').style.visibility = currentTab === 0 ? 'hidden' : 'visible';
        document.getElementById('btnNext').style.display = currentTab === PILARES.length - 1 ? 'none' : 'block';
        document.getElementById('btnResult').style.display = currentTab === PILARES.length - 1 ? 'block' : 'none';

        const answered = document.querySelectorAll('input:checked').length;
        document.getElementById('progressBar').style.width = (answered / 40 * 100) + "%";
    }

    function saveProgress() {
        const data = { empresa: document.getElementById('nomeEmpresa').value, respostas: {} };
        document.querySelectorAll('input:checked').forEach(input => {
            data.respostas[input.name] = input.value;
        });
        localStorage.setItem('linwe_diag_v2', JSON.stringify(data));
        updateUI();
    }

    function loadProgress() {
        const saved = localStorage.getItem('linwe_diag_v2');
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById('nomeEmpresa').value = data.empresa || "";
            for (const key in data.respostas) {
                const el = document.querySelector(`input[name="${key}"][value="${data.respostas[key]}"]`);
                if (el) el.checked = true;
            }
        }
    }

    function calculateResults() {
        const empresa = document.getElementById('nomeEmpresa').value;
        if (!empresa) return alert("Informe o nome da empresa.");
        if (document.querySelectorAll('input:checked').length < 40) return alert("Responda todas as questões.");

        const results = PILARES.map((pilar, pIdx) => {
            let sE = 0, sF = 0;
            for (let qIdx = 0; qIdx < 5; qIdx++) {
                sE += parseInt(document.querySelector(`input[name="e_${pIdx}_${qIdx}"]:checked`).value);
                sF += parseInt(document.querySelector(`input[name="f_${pIdx}_${qIdx}"]:checked`).value);
            }
            const mE = sE / 5;
            const mF = sF / 5;
            const mG = (mE + mF) / 2;
            const idx = ((mE + mF) / 10) * 100;

            let sit = "Não Implantado", cor = "#f56565";
            if (mG >= 4) { sit = "Consolidado"; cor = "#48bb78"; }
            else if (mG >= 3) { sit = "Em Desenvolvimento"; cor = "#ecc94b"; }
            else if (mG >= 2) { sit = "Desconectado"; cor = "#ed8936"; }

            let prio = "Baixa";
            if (mG <= 2) prio = "Muito Alta";
            else if (mG <= 2.5) prio = "Alta";
            else if (mG <= 3.5) prio = "Média";

            return { nome: pilar.nome, idx, sit, cor, prio, rec: pilar.rec, servico: pilar.servico, prazo: pilar.prazo };
        });

        const idxGeral = results.reduce((a, b) => a + b.idx, 0) / 4;
        let mat = "Baixo";
        if (idxGeral >= 80) mat = "Alto";
        else if (idxGeral >= 60) mat = "Médio-Alto";
        else if (idxGeral >= 40) mat = "Médio";
        else if (idxGeral >= 20) mat = "Médio-Baixo";

        renderResults(empresa, idxGeral, mat, results);
    }

    function renderResults(empresa, idx, mat, results) {
        document.getElementById('mainForm').style.display = 'none';
        document.getElementById('resultsArea').style.display = 'block';
        document.getElementById('resEmpresa').innerText = empresa;

        document.getElementById('summaryGrid').innerHTML = `
            <div class="summary-card"><h4>Índice Geral</h4><div class="value">${idx.toFixed(1)}%</div></div>
            <div class="summary-card"><h4>Maturidade</h4><div class="value">${mat}</div></div>
        `;

        let html = "";
        results.forEach(r => {
            html += `
                <div class="pillar-report">
                    <div class="pillar-header">
                        <h3 style="color:var(--navy)">${r.nome}</h3>
                        <span class="status-badge" style="background:${r.cor}">${r.sit}</span>
                    </div>
                    <div style="font-size:13px; margin-bottom:10px;">
                        <strong>Índice:</strong> ${r.idx.toFixed(1)}% | <strong>Prioridade:</strong> ${r.prio}
                    </div>
                    <div class="rec-box">${r.rec}</div>
                    <span class="service-tag">Serviço: ${r.servico} | Prazo: ${r.prazo}</span>
                </div>
            `;
        });
        document.getElementById('detailedResults').innerHTML = html;
        window.scrollTo(0, 0);
    }

    function resetForm() {
        if (confirm("Deseja iniciar um novo diagnóstico?")) {
            localStorage.removeItem('linwe_diag_v2');
            location.reload();
        }
    }

    init();
</script>
</body>
</html>
